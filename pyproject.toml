[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-keyword-research-tool"
version = "0.1.0"
description = "Keyword research tool for Python and the command line: expand one seed into up to 500 Google autocomplete keywords (questions, alphabet, prepositions, comparisons) with Google's relevance score, or read the raw suggestions of any query, as JSON or CSV. Free and open source; no Google Ads account or proxies needed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["keyword-research", "keyword-research-tool", "keyword-tool", "keyword-generator", "keyword-finder", "google-autocomplete", "autocomplete", "long-tail-keywords", "seo", "seo-tools", "content-ideas", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
keyword-research = "quanticdata_keyword_research_tool.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/keyword-research-api/?utm_source=github&utm_medium=pypi&utm_campaign=keyword-research-tool"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/keyword-research-tool"
Issues = "https://github.com/quantumproxies/keyword-research-tool/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_keyword_research_tool" = ["spec.json", "py.typed"]
